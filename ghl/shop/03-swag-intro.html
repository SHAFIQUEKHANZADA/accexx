<!-- ACCEXX SHOP | 03 CONFERENCE SWAG INTRO. Copy from Dr. A's swag sheet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.ax{--navy:#1f3864;--navy-deep:#16294a;--gold:#c9974b;--gold-deep:#9c7437;--gold-light:#e8c98f;--cream:#fbf7f0;--sand:#f3ecdf;--line:#e8e1d4;--ink:#1a2233;--body:#4a5163;--muted:#737a8a;--teal:#1f8fa8;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.ax *,.ax *::before,.ax *::after{box-sizing:border-box;margin:0;padding:0}
.ax img{display:block;max-width:100%;height:auto}
.ax a{color:inherit;text-decoration:none}
.ax ul{list-style:none}
.ax-wrap{width:100%;max-width:80rem;margin:0 auto;padding:0 1.25rem}
@media(min-width:768px){.ax-wrap{padding:0 2rem}}
.ax-eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)}
.ax-h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:clamp(2.2rem,4.5vw,3.2rem);line-height:1.08;margin-top:.75rem}
.ax-h2 em,.ax-gold{color:var(--gold);font-style:italic}
.ax-btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;height:3rem;padding:0 1.6rem;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.ax .ax-btn--gold{background:var(--gold);color:#fff}.ax .ax-btn--gold:hover{background:var(--gold-deep)}
.ax .ax-btn--navy{background:var(--navy);color:#fff}.ax .ax-btn--navy:hover{background:var(--navy-deep)}
.ax .ax-btn--outline{border-color:rgba(31,56,100,.25);color:var(--navy)}.ax .ax-btn--outline:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.ax .ax-btn--light{border-color:rgba(255,255,255,.4);color:#fff}.ax .ax-btn--light:hover{background:#fff;color:var(--navy)}
.ax-btn svg{transition:transform .25s}.ax-btn:hover svg{transform:translateX(3px)}
.ax-mark{width:2.6rem;height:2.6rem;color:var(--navy);flex-shrink:0}
.ax-logo{display:inline-flex;align-items:center;gap:.65rem;font-family:"Cormorant Garamond",Georgia,serif;line-height:1}
.ax-logo b{font-weight:700;letter-spacing:.08em;font-size:1.45rem;color:var(--navy)}
.ax-logo i{font-size:1.55rem;color:var(--gold-deep)}
</style>
<style>
.ax-swag{background:#fff;border-bottom:1px solid var(--line);padding:3.5rem 0}
.ax-swag .ax-wrap{display:grid;gap:2.5rem;align-items:center}
.ax-swag-sub{margin-top:1rem;font-size:1.1rem;color:var(--body)}
.ax-pills{display:grid;gap:1rem}
.ax-pills li{display:flex;align-items:center;gap:1rem;background:var(--cream);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.25rem}
.ax-pill-ic{display:grid;place-items:center;width:3rem;height:3rem;border-radius:999px;color:#fff;flex-shrink:0}
.ax-pills b{display:block;color:var(--navy)}
.ax-pills li>span>span{font-size:.9rem;color:var(--body)}
@media(min-width:640px){.ax-pills{grid-template-columns:repeat(3,1fr)}.ax-pills li{flex-direction:column;align-items:flex-start;padding:1.5rem}}
@media(min-width:1024px){.ax-swag{padding:4rem 0}.ax-swag .ax-wrap{grid-template-columns:5fr 7fr;gap:4rem}}
</style>
<section class="ax ax-swag" aria-labelledby="ax-swag-title">
  <div class="ax-wrap">
    <div>
      <p class="ax-eyebrow">Official conference swag</p>
      <h2 class="ax-h2" id="ax-swag-title">Wear the mindset. <em>Live the message.</em></h2>
      <p class="ax-swag-sub">More than swag. It&rsquo;s a reminder of why you lead.</p>
    </div>
    <ul class="ax-pills">
      <li><span class="ax-pill-ic" style="background:var(--teal)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5M10 20v-5h4v5"/></svg></span><span><b>My Home</b><span>Lead with values.</span></span></li>
      <li><span class="ax-pill-ic" style="background:var(--gold)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 12h18"/></svg></span><span><b>My Work</b><span>Lead with strategy.</span></span></li>
      <li><span class="ax-pill-ic" style="background:var(--navy)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></svg></span><span><b>My Universe</b><span>Lead with purpose.</span></span></li>
    </ul>
  </div>
</section>
