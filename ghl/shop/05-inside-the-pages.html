<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.ax{--navy:#1f3864;--navy-deep:#16294a;--gold:#c9974b;--gold-deep:#9c7437;--gold-light:#e8c98f;--cream:#fbf7f0;--sand:#f3ecdf;--line:#e8e1d4;--ink:#1a2233;--body:#4a5163;--muted:#737a8a;--teal:#1f8fa8;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.ax *,.ax *::before,.ax *::after{box-sizing:border-box;margin:0;padding:0}
.ax img{display:block;max-width:100%;height:auto}
.ax a{color:inherit;text-decoration:none}
.ax ul{list-style:none}
.ax-wrap{width:100%;max-width:80rem;margin:0 auto;padding:0 1.25rem}
@media(min-width:768px){.ax-wrap{padding:0 2rem}}
.ax-eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)}
.ax-h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:clamp(2.2rem,4.5vw,3.2rem);line-height:1.08;margin-top:.75rem}
.ax-h2 em,.ax-gold{color:var(--gold);font-style:italic}
.ax-btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;height:3rem;padding:0 1.6rem;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.ax .ax-btn--gold{background:var(--gold);color:#fff}.ax .ax-btn--gold:hover{background:var(--gold-deep)}
.ax .ax-btn--navy{background:var(--navy);color:#fff}.ax .ax-btn--navy:hover{background:var(--navy-deep)}
.ax .ax-btn--outline{border-color:rgba(31,56,100,.25);color:var(--navy)}.ax .ax-btn--outline:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.ax .ax-btn--light{border-color:rgba(255,255,255,.4);color:#fff}.ax .ax-btn--light:hover{background:#fff;color:var(--navy)}
.ax-btn svg{transition:transform .25s}.ax-btn:hover svg{transform:translateX(3px)}
.ax-mark{width:2.6rem;height:2.6rem;color:var(--navy);flex-shrink:0}
.ax-logo{display:inline-flex;align-items:center;gap:.65rem;font-family:"Cormorant Garamond",Georgia,serif;line-height:1}
.ax-logo b{font-weight:700;letter-spacing:.08em;font-size:1.45rem;color:var(--navy)}
.ax-logo i{font-size:1.55rem;color:var(--gold-deep)}
</style>
<style>
.ax-itp{background:var(--cream);padding:4rem 0}
.ax-itp .ax-wrap{display:grid;gap:2.5rem;align-items:center}
.ax-itp-img{aspect-ratio:1465/794;border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px -20px rgba(31,56,100,.3)}
.ax-itp-img img{width:100%;height:100%;object-fit:cover}
.ax-itp-quote{margin-top:1rem;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.5rem;line-height:1.4;color:rgba(31,56,100,.8)}
.ax-itp-when{margin-top:1.25rem;color:var(--body)}
.ax-itp-when b{color:var(--navy)}
.ax-itp-cta{margin-top:2rem}
@media(min-width:1024px){.ax-itp{padding:5rem 0}.ax-itp .ax-wrap{grid-template-columns:1fr 1fr;gap:4rem}}
</style>
<section class="ax ax-itp" aria-labelledby="ax-itp-title">
  <div class="ax-wrap">
    <div class="ax-itp-img"><img src="https://accexx-xi.vercel.app/images/inside-the-pages-set.jpg" alt="The Inside the Pages with Dr. A set: mustard backdrop and armchairs" loading="lazy" width="1465" height="794"></div>
    <div>
      <p class="ax-eyebrow">New event series</p>
      <h2 class="ax-h2" id="ax-itp-title">Inside the Pages <em>with Dr. A</em></h2>
      <p class="ax-itp-quote">&ldquo;Every Book. Different Perspective.&rdquo; Where books become conversations.</p>
      <p class="ax-itp-when">First session: <b>Dec 12, 2026</b> at <b>The Cannon</b>.</p>
      <div class="ax-itp-cta"><a class="ax-btn ax-btn--gold" href="https://www.accexxinsight.com/inside-the-pages">Discover Inside the Pages <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
    </div>
  </div>
</section>
